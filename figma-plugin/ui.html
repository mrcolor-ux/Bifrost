<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<style>
:root {
  color-scheme: light;
  --canvas: #f5f5f9; --surface: #fff; --ink: #24233a; --muted: #65647b;
  --border: #dcdce7; --line: #ecebf2; --soft: #f7f7fb; --accent: #5940bc;
  --accent-hover: #49329f; --tint: #f0ecfb; --good: #197054; --good-bg: #e6f5ef;
  --bad: #aa3347; --bad-bg: #fceef0; --wait: #8c6010; --wait-bg: #fff3cf;
}
.figma-dark {
  color-scheme: dark;
  --canvas: #202028; --surface: #2b2b35; --ink: #f3f1fb; --muted: #bbb9cd;
  --border: #4b495a; --line: #403e4c; --soft: #353440; --accent: #b9a8ff;
  --accent-hover: #cfbfff; --tint: #3c3455; --good: #83dcba; --good-bg: #233e34;
  --bad: #ffadba; --bad-bg: #492e37; --wait: #f1d38c; --wait-bg: #453e2d;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--canvas); color: var(--ink); font: 13px/1.45 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
h1, h2, h3, p { margin: 0; }
button, input { font: inherit; }
button { cursor: pointer; font-size: 12px; font-weight: 600; }
button:disabled { cursor: default; opacity: .58; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
header { position: relative; isolation: isolate; overflow: hidden; display: flex; align-items: center; gap: 12px;
  min-height: 68px; padding: 12px 18px; background: #22203c; color: #fff; }
header::after { content: ""; position: absolute; z-index: -1; inset: 0 0 0 44%;
  background: radial-gradient(ellipse 116px 85px at 87% 152%, transparent 70%, #6663a3 71%, transparent 73%, transparent 78%, #8e87ae 79%, transparent 81%, transparent 88%, #8d709d 89%, transparent 91%, transparent 98%, #70588c 99%, transparent 101%, transparent 109%, #524668 110%, transparent 112%); }
.logo { width: 42px; height: 42px; border-radius: 12px; }
h1 { font-size: 20px; line-height: 1.15; letter-spacing: -.65px; }
.sub { font-size: 12px; color: #d0ccdf; margin-top: 3px; }
.version { align-self: flex-start; margin-left: auto; color: #dbd6ec; font: 11px/18px ui-monospace, Menlo, monospace; }
main { display: grid; gap: 10px; padding: 12px; }
section { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; min-width: 0; }
.section-head { padding: 10px 14px 0; }
h2 { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.25px; color: var(--muted); }
.connection { padding: 7px 14px 10px; display: flex; align-items: center; gap: 8px; justify-content: space-between; }
.status { display: flex; align-items: baseline; gap: 8px; font-weight: 600; line-height: 1.4; }
.dot { width: 8px; height: 8px; flex: none; border-radius: 50%; background: var(--muted); }
.dot.on { background: var(--good); box-shadow: 0 0 0 3px var(--good-bg); }
.dot.wait { background: var(--wait); box-shadow: 0 0 0 3px var(--wait-bg); }
button { border: 1px solid transparent; background: var(--accent); color: var(--surface); padding: 7px 10px; border-radius: 7px; line-height: 1.25; }
button:hover:enabled { background: var(--accent-hover); }
#btn { flex: none; }
#btn.off { background: var(--surface); color: var(--ink); border-color: var(--border); }
#btn.off:hover { background: var(--soft); }
.server { border-top: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; padding: 6px 14px; font-size: 11px; color: var(--muted); }
.endpoint { display: flex; align-items: center; font: 11px/1.2 ui-monospace, Menlo, monospace; }
input { background: var(--surface); color: var(--ink); border: 1px solid var(--border); border-radius: 6px; padding: 7px 8px; min-width: 0; }
input::placeholder { color: var(--muted); }
#port { width: 46px; padding: 3px; font: inherit; text-align: center; }
#port:read-only { width: 30px; padding-inline: 0; border-color: transparent; }
#pair { border-top: 1px solid var(--line); padding: 10px 14px 14px; }
#pair label, #link-edit label { display: block; margin-bottom: 5px; font-weight: 550; font-size: 12px; }
#token { width: 100%; }
.document-row { display: flex; align-items: center; gap: 10px; padding: 9px 14px 13px; }
.file-icon { flex: none; width: 32px; height: 36px; display: grid; place-items: center; border-radius: 7px; background: var(--tint); color: var(--accent); }
.file-icon::before { content: ""; width: 11px; height: 15px; border: 1.5px solid currentColor; border-radius: 2px; background: linear-gradient(currentColor,currentColor) 2px 7px/7px 1px no-repeat, linear-gradient(currentColor,currentColor) 2px 10px/5px 1px no-repeat; }
.file-meta { min-width: 0; flex: 1; }
#file-name { font-size: 14px; font-weight: 650; overflow-wrap: anywhere; }
#page-name { font-size: 11px; color: var(--muted); overflow-wrap: anywhere; }
#link-form { border-top: 1px solid var(--line); padding: 10px 14px; }
.link-entry { display: flex; gap: 6px; }
#file-link { flex: 1; width: 0; font-size: 12px; }
#link-status:not(:empty) { margin-top: 6px; font-size: 12px; color: var(--bad); }
.bound-row { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.bound-label { color: var(--good); font-size: 12px; font-weight: 600; }
summary { cursor: pointer; color: var(--accent); font-size: 12px; }
#bound-url { display: block; padding: 6px 0; font: 11px/1.55 ui-monospace, Menlo, monospace; overflow-wrap: anywhere; color: var(--muted); }
#link-details > summary { text-align: right; }
#link-details[open] { flex: 1; min-width: 0; }
#forget-link { background: none; border: 0; padding: 0; color: var(--bad); font-size: 12px; cursor: pointer; }
#forget-link[hidden] { display: none; }
.activity-head { display: flex; align-items: center; gap: 7px; padding: 11px 14px; border-bottom: 1px solid var(--line); }
#log-count { font: 10px/1.4 ui-monospace, Menlo, monospace; color: var(--muted); }
#log { max-height: 156px; overflow: auto; scrollbar-width: thin; }
#log:empty::before { content: "Aún no hay actividad"; display: block; padding: 14px; color: var(--muted); font-size: 12px; }
.event { display: grid; grid-template-columns: 7px minmax(0,1fr) auto; align-items: baseline; gap: 8px; padding: 7px 14px; }
.event + .event { border-top: 1px solid var(--line); }
.event::before { content: ""; width: 5px; height: 5px; border-radius: 50%; align-self: start; margin-top: 5px; background: var(--accent); }
.event time { color: var(--muted); font: 10px/1.5 ui-monospace, Menlo, monospace; }
.event span { font-size: 12px; overflow-wrap: anywhere; }
.event.command span { font: 11px/1.5 ui-monospace, Menlo, monospace; }
.event.success::before { background: var(--good); }
.event.error { color: var(--bad); background: var(--bad-bg); }
.event.error::before { background: var(--bad); }
</style>
</head>

  var ws = null;
  var wanted = false;
  var retryTimer = null;
  var fileInfo = {};
  var token = "";
  var authenticated = false;
  var confirmedLink = '';
  var pendingLink = '';
  var $ = function (id) { return document.getElementById(id); };

  function log(t, kind) {
    var el = $('log');
    var line = document.createElement('div');
    var message = document.createElement('span');
    var time = document.createElement('time');
    var now = new Date();
    line.className = 'event ' + (kind || '');
    message.textContent = t;
    time.dateTime = now.toISOString();
    time.textContent = now.toLocaleTimeString('es-MX', { hour12: false });
    line.appendChild(message);
    line.appendChild(time);
    el.appendChild(line);
    while (el.childNodes.length > 60) el.removeChild(el.firstChild);
    $('log-count').textContent = String(el.childNodes.length);
    el.scrollTop = el.scrollHeight;
  }
  function setStatus(state, text) {
    $('dot').className = 'dot ' + (state === 'on' ? 'on' : state === 'wait' ? 'wait' : '');
    $('status').textContent = text;
    $('port').readOnly = wanted;
    $('btn').textContent = wanted ? 'Desconectar' : 'Conectar';
    $('btn').className = wanted ? 'off' : '';
    parent.postMessage({ pluginMessage: { type: 'status', state: state } }, '*');
  }

  function sendBinding(link) {
    if (!authenticated || !ws || ws.readyState !== 1 || pendingLink) return;
    pendingLink = link;
    $('bind-link').disabled = true;
    $('link-status').textContent = 'Asociando enlace…';
    ws.send(JSON.stringify({ type: 'bind_link', url: link }));
  }

  // Muestra el estado del enlace asociado (nuevo, recuperado del archivo o ninguno)
  function renderLink(removable) {
    $('bound-row').hidden = !confirmedLink;
    $('link-edit').hidden = !!confirmedLink;
    $('link-status').hidden = !!confirmedLink;
    $('bound-url').textContent = confirmedLink;
    $('forget-link').hidden = !removable;
    $('file-link').readOnly = !!confirmedLink;
    $('bind-link').disabled = !!confirmedLink;
  }

  $('forget-link').onclick = function () {
    if (!authenticated || !ws || ws.readyState !== 1) return;
    $('forget-link').disabled = true;
    ws.send(JSON.stringify({ type: 'unbind_link' }));
  };

  $('link-form').onsubmit = function (ev) {
    ev.preventDefault();
    if (!confirmedLink) sendBinding($('file-link').value.trim());
  };

  function hex(bytes) {
    return Array.from(bytes, function (byte) { return byte.toString(16).padStart(2, '0'); }).join('');
  }

  async function proof(side, client, server) {
    var message = 'bifrost-v5:' + side + ':plugin:' + client + ':' + server;
    if (!crypto.subtle) return window.sha256.hmac(token, message);
    var encoder = new TextEncoder();
    var key = await crypto.subtle.importKey('raw', encoder.encode(token),
      { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']);
    return hex(new Uint8Array(await crypto.subtle.sign('HMAC', key, encoder.encode(message))));
  }

  function sameProof(expected, actual) {
    var difference = 0;
    for (var i = 0; i < expected.length; i++) {
      difference |= expected.charCodeAt(i) ^ actual.charCodeAt(i);
    }
    return difference === 0;
  }

  function connect() {
    if (ws) return;
    var port = $('port').value || '3055';
    setStatus('wait', 'Conectando a localhost:' + port + '…');
    try { ws = new WebSocket('ws://localhost:' + port); }
    catch (e) {
      ws = null;
      wanted = false;
      setStatus('off', 'Figma rechazó abrir el WebSocket local');
      log(e.message, 'error');
      return;
    }
    var socket = ws;
    var client = hex(crypto.getRandomValues(new Uint8Array(32)));
    var stage = 'challenge';
    var failure = null;
    var authTimer;
    function failConnection(message) {
      failure = message;
      wanted = false;
      $('pair').hidden = false;
      socket.close();
    }
    socket.onopen = function () {
      authTimer = setTimeout(function () {
        failConnection('El puente no confirmó la vinculación');
      }, 11000);
      socket.send(JSON.stringify({ type: 'auth_start', nonce: client }));
    };
    socket.onmessage = async function (ev) {
      var msg;
      try { msg = JSON.parse(ev.data); } catch (e) { return; }
      if (!msg || typeof msg !== 'object') return;
      if (!authenticated) {
        try {
          if (stage === 'challenge' && msg.type === 'auth_challenge' &&
              /^[0-9a-f]{64}$/.test(msg.nonce) && /^[0-9a-f]{64}$/.test(msg.proof)) {
            stage = 'verifying';
            var serverProof = await proof('server', client, msg.nonce);
            if (!sameProof(serverProof, msg.proof)) {
              failConnection('El código no coincide con el puente local'); return;
            }
            var clientProof = await proof('client', client, msg.nonce);
            if (ws !== socket || socket.readyState !== 1) return;
            stage = 'confirmation';
            socket.send(JSON.stringify({ type: 'auth_proof', proof: clientProof }));
            return;
          }
          if (stage === 'confirmation' && msg.type === 'auth_ok') {
            clearTimeout(authTimer);
            stage = 'registration';
            setStatus('wait', 'Registrando documento en Bifrost…');
            authTimer = setTimeout(function () {
              failConnection('El puente no confirmó el documento. Reinicia Claude con Bifrost actualizado.');
            }, 7000);
            socket.send(JSON.stringify({ type: 'hello', fileName: fileInfo.fileName,
              fileKey: fileInfo.fileKey, fileKeySource: fileInfo.fileKeySource,
              page: fileInfo.page, version: fileInfo.version }));
            return;
          }
          if (stage !== 'registration' || msg.type !== 'registered') {
            failConnection(stage === 'registration' ? 'El puente rechazó el registro del documento' :
              'El puente local no confirmó la vinculación');
            return;
          }
          clearTimeout(authTimer);
          stage = 'ready';
          authenticated = true;
          $('pair').hidden = true;
          parent.postMessage({ pluginMessage: { type: 'pair', token: token } }, '*');
          setStatus('on', 'Conectado con Claude');
          log('Documento registrado en Bifrost', 'success');
          $('link-form').hidden = !msg.canBindLink && !msg.linkRemovable;
          if (msg.storedKeyRejected) {
            // Otra pestaña ya usa el enlace guardado en este archivo (p. ej. un duplicado)
            confirmedLink = '';
            fileInfo.fileKey = null;
            fileInfo.fileKeySource = null;
            log('El enlace guardado en este archivo ya lo usa otra pestaña. Si es una copia, asocia su propio enlace.', 'error');
          } else if (msg.linkRemovable && !confirmedLink) {
            confirmedLink = fileInfo.storedLink || 'Enlace guardado en el archivo';
            log('Enlace recuperado del archivo', 'success');
          }
          renderLink(!!msg.linkRemovable);
          if (msg.canBindLink && confirmedLink) sendBinding(confirmedLink);
        } catch (e) { failConnection('El puente local no completó la conexión'); }
        return;
      }
      if (msg.type === 'link_binding' && pendingLink) {
        if (msg.error) {
          confirmedLink = '';
          $('link-status').textContent = msg.error;
        } else {
          confirmedLink = pendingLink;
          $('file-link').value = confirmedLink;
          $('link-status').textContent = 'Enlace asociado a este documento';
          if (msg.fileKey) {
            // Lo guarda en el archivo para recuperarlo al volver a abrir Bifrost
            fileInfo.fileKey = msg.fileKey;
            fileInfo.fileKeySource = 'stored';
            fileInfo.storedLink = confirmedLink;
            parent.postMessage({ pluginMessage: { type: 'save_link', key: msg.fileKey, url: confirmedLink } }, '*');
          }
        }
        pendingLink = '';
        renderLink(!!confirmedLink);
        return;
      }
      if (msg.type === 'link_unbound') {
        $('forget-link').disabled = false;
        if (msg.removed) {
          confirmedLink = '';
          fileInfo.fileKey = null;
          fileInfo.fileKeySource = null;
          fileInfo.storedLink = '';
          $('file-link').value = '';
          $('link-status').textContent = '';
          parent.postMessage({ pluginMessage: { type: 'forget_link' } }, '*');
          log('Enlace quitado de este documento', 'success');
        }
        renderLink(!!confirmedLink);
        return;
      }
      if (!msg.id || typeof msg.command !== 'string') return;
      log(msg.command, 'command');
      parent.postMessage({ pluginMessage: msg }, '*');
    };
    socket.onclose = function () {
      clearTimeout(authTimer);
      ws = null;
      authenticated = false;
      pendingLink = '';
      $('link-form').hidden = true;
      $('bind-link').disabled = false;
      if (failure) setStatus('off', failure);
      else if (stage === 'registration') {
        wanted = false;
        setStatus('off', 'El puente cerró la conexión antes de registrar el documento');
      }
      else if (wanted) { setStatus('wait', 'Sin servidor. Reintentando…'); scheduleRetry(); }
      else setStatus('off', 'Desconectado');
    };
  }
  function scheduleRetry() {
    clearTimeout(retryTimer);
    retryTimer = setTimeout(function () { if (wanted) connect(); }, 2000);
  }
  function disconnect() {
    wanted = false;
    clearTimeout(retryTimer);
    if (ws) ws.close();
    setStatus('off', 'Desconectado');
  }

  $('btn').onclick = function () {
    if (wanted) {
      // Desconectar cierra el plugin completo (también el modo oculto)
      disconnect();
      parent.postMessage({ pluginMessage: { type: 'close' } }, '*');
    } else {
      token = $('token').value.trim() || token;
      $('token').value = '';
      if (!/^[0-9a-f]{64}$/.test(token)) {
        setStatus('off', 'Pega el código de ~/.bifrost/token');
        return;
      }
      wanted = true;
      connect();
    }
  };

  // Figma media los mensajes del iframe. El canal identifica los mensajes
  // de esta instancia aunque el evento no indique al padre como origen.
  var channel = hex(crypto.getRandomValues(new Uint8Array(32)));
  var initTimer = setTimeout(function () {
    setStatus('off', 'El plugin no respondió al panel. Cierra Bifrost y vuelve a abrirlo.');
  }, 7000);

  // Respuestas desde code.js -> servidor
  window.onmessage = function (ev) {
    var msg = ev.data && ev.data.pluginMessage;
    if (!msg || msg.channel !== channel) return;
    if (msg.type === 'init') {
      clearTimeout(initTimer);
      $('btn').disabled = false;
      fileInfo = msg;
      $('document-card').hidden = false;
      $('file-name').textContent = msg.fileName;
      $('page-name').textContent = msg.page;
      token = msg.token || '';
      $('pair').hidden = !!token;
      if (token) { wanted = true; connect(); }
      else setStatus('off', 'Pega el código de ~/.bifrost/token');
      return;
    }
    if (msg.type === 'active') {
      fileInfo.page = msg.page;
      fileInfo.fileName = msg.fileName || fileInfo.fileName;
      $('page-name').textContent = fileInfo.page;
      $('file-name').textContent = fileInfo.fileName;
    }
    if (msg.error) log('Error · ' + msg.error, 'error');
    if (authenticated && ws && ws.readyState === 1) {
      delete msg.channel;
      ws.send(JSON.stringify(msg));
    }
  };
  parent.postMessage({ pluginMessage: { type: 'panel_ready', channel: channel } }, '*');
</script>
</body>
</html>
