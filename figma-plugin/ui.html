  <div class="row">
    <label>Puerto <input id="port" value="3055"></label>
    <button id="btn">Conectar</button>
  </div>
  <div class="status"><span id="dot" class="dot"></span><span id="status">Desconectado</span></div>
  <div id="log"></div>
<script>
  var ws = null;
  var wanted = false;
  var retryTimer = null;
  var fileInfo = {};
  var $ = function (id) { return document.getElementById(id); };

  function log(t) {
    var el = $('log');
    var line = document.createElement('div');
    line.textContent = new Date().toLocaleTimeString() + '  ' + t;
    el.appendChild(line);
    while (el.childNodes.length > 60) el.removeChild(el.firstChild);
    el.scrollTop = el.scrollHeight;
  }
  function setStatus(state, text) {
    $('dot').className = 'dot ' + (state === 'on' ? 'on' : state === 'wait' ? 'wait' : '');
    $('status').textContent = text;
    $('btn').textContent = wanted ? 'Desconectar' : 'Conectar';
    $('btn').className = wanted ? 'off' : '';
    parent.postMessage({ pluginMessage: { type: 'status', state: state } }, '*');
  }

  function connect() {
    if (ws) return;
    var port = $('port').value || '3055';
    setStatus('wait', 'Conectando a localhost:' + port + '…');
    try { ws = new WebSocket('ws://localhost:' + port); }
    catch (e) { ws = null; scheduleRetry(); return; }

    ws.onopen = function () {
      setStatus('on', 'Conectado con Claude');
      log('Conectado');
      ws.send(JSON.stringify({ type: 'hello', fileName: fileInfo.fileName, fileKey: fileInfo.fileKey, page: fileInfo.page }));
    };
    ws.onmessage = function (ev) {
      var msg;
      try { msg = JSON.parse(ev.data); } catch (e) { return; }
      if (msg.command) log('→ ' + msg.command);
      parent.postMessage({ pluginMessage: msg }, '*');
    };
    ws.onclose = function () {
      ws = null;
      if (wanted) { setStatus('wait', 'Sin servidor. Reintentando…'); scheduleRetry(); }
      else setStatus('off', 'Desconectado');
    };
    ws.onerror = function () { /* onclose se encarga */ };
  }
  function scheduleRetry() {
    clearTimeout(retryTimer);
    retryTimer = setTimeout(function () { if (wanted) connect(); }, 2000);
  }
  function disconnect() {
    wanted = false;
    clearTimeout(retryTimer);
    if (ws) ws.close();
    setStatus('off', 'Desconectado');
  }

  $('btn').onclick = function () {
    if (wanted) {
      // Desconectar cierra el plugin completo (también el modo oculto)
      disconnect();
      parent.postMessage({ pluginMessage: { type: 'close' } }, '*');
    } else { wanted = true; connect(); }
  };

  // Respuestas desde code.js -> servidor
  window.onmessage = function (ev) {
    var msg = ev.data && ev.data.pluginMessage;
    if (!msg) return;
    if (msg.type === 'init') { fileInfo = msg; wanted = true; connect(); return; }
    if (msg.type === 'active') { fileInfo.page = msg.page; }
    if (msg.error) log('✕ ' + msg.error);
    if (ws && ws.readyState === 1) ws.send(JSON.stringify(msg));
  };
</script>
